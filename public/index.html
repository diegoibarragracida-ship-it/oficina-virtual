const newMul=async()=>{const [inf,u]=await Promise.all([api('/infracciones'),api('/ajustes/uma')]),ok=inf.filter(i=>i.activo&&(i.umaMin>0||i.monto>0));modal('Registrar multa por infracción a un reglamento',[{id:'infraccion',label:'Infracción',type:'select',opts:ok.map(i=>[i._id,`${i.reglamento||i.categoria||''}${i.articulo?' · Art. '+i.articulo:''} — ${i.descripcion} (${sancion(i,u.valor)})`])},{id:'umas',label:'UMAs a aplicar (vacío = el mínimo)',type:'number'},{id:'sujeto',label:'¿A quién se sanciona?',type:'select',opts:[['persona','Persona'],['establecimiento','Establecimiento o negocio'],['vehiculo','Vehículo'],['predio','Predio u obra']]},{id:'infractor',label:'Nombre del infractor o razón social'},{id:'identificador',label:'Placa, número de licencia, clave catastral o CURP (opcional)'},{id:'lugar',label:'Domicilio o lugar de la infracción'},{id:'medida',label:'Medida aplicada',type:'select',opts:MEDIDAS.map(x=>[x,x])},{id:'acta',label:'Folio del acta de inspección (opcional)'},{id:'observaciones',label:'Hechos observados',type:'textarea'},{id:'foto',label:'Foto de evidencia (opcional)',type:'file'}],async v=>{const f=v.foto;await api('/multas','POST',{...v,foto:f?await comp(f):undefined});multas()})};
const resMul=id=>modal('Resolver multa',[{id:'resolucion',label:'Resolución',type:'select',opts:[['confirmar','Mantener la multa'],['reducir','Reducir el monto'],['cancelar','Cancelar la multa']]},{id:'monto',label:'Nuevo monto en pesos (solo si reduces)',type:'number'},{id:'nota',label:'Motivo o nota (obligatorio al cancelar)'}],async v=>{await api(`/multas/${id}/resolver`,'POST',v);multas()});
async function infrac(){const [l,u]=await Promise.all([api('/infracciones'),api('/ajustes/uma')]);$('#main').innerHTML=`<div class=card><h3>Catálogo de infracciones y sanciones</h3><div class=tip>Registra cada infracción con su reglamento y artículo, y define la sanción en UMAs (mínimo y máximo) o en pesos fijos. Valor de la UMA vigente: <b>${u.valor?M(u.valor):'sin definir'}</b>. Toma los datos de tu reglamento municipal y el valor oficial publicado por INEGI.</div><button onclick="newInf()">Agregar infracción</button> <button class=sec onclick="plantInf()">Cargar infracciones comunes</button> <button class=sec onclick="defUma()">Valor de la UMA</button><table><tr><th>Reglamento<th>Art.<th>Infracción<th>Sanción<th></tr>${opts(l,i=>`<tr><td>${esc(i.reglamento||i.categoria||'')}<td>${esc(i.articulo||'')}<td>${esc(i.descripcion)}${i.activo?'':' (inactiva)'}<td>${sancion(i,u.valor)||'<span class=red>Sin definir</span>'}<td><button onclick="edInf('${i._id}')">Editar</button>`)||'<tr><td>Sin infracciones'}</table></div>`}
const plantInf=async()=>{try{const r=await api('/infracciones/plantillas','POST');alert(r.creadas+' infracciones agregadas sin sanción: define el artículo y la sanción de cada una.');infrac()}catch(e){alert(e.message)}};
const defUma=()=>modal('Valor de la UMA',[{id:'valor',label:'Valor diario vigente de la UMA en pesos (consúltalo en INEGI)',type:'number'}],async v=>{await api('/ajustes/uma','POST',v);infrac()});
const camposInf=i=>[{id:'reglamento',label:'Reglamento',type:'select',opts:REGL.map(x=>[x,x]),value:i?.reglamento||i?.categoria||'Otro reglamento'},{id:'articulo',label:'Artículo',value:i?.articulo||''},{id:'descripcion',label:'Descripción de la infracción',value:i?.descripcion||''},{id:'umaMin',label:'Sanción mínima en UMAs',type:'number',value:i?.umaMin||''},{id:'umaMax',label:'Sanción máxima en UMAs',type:'number',value:i?.umaMax||''},{id:'monto',label:'O monto fijo en pesos (si no usa UMAs)',type:'number',value:i?.monto||''},{id:'fundamento',label:'Fundamento legal',value:i?.fundamento||''}];
const newInf=()=>modal('Nueva infracción',camposInf(),async v=>{await api('/infracciones','POST',v);infrac()});
const edInf=async id=>{const i=(await api('/infracciones')).find(x=>x._id==id);modal('Editar infracción',[...camposInf(i),{id:'activo',label:'Estado',type:'select',opts:[['true','Activa'],['false','Inactiva']],value:String(i.activo)}],async v=>{await api('/infracciones/'+id,'PUT',{...v,activo:v.activo=='true'});infrac()})};

<a class=skip href="#main">Saltar al contenido</a><aside id="nav" aria-label="Menú principal"></aside><div id="app"><div id="top"></div><main id="main" tabindex="-1"></main><footer id=ft></footer></div>
<script src="/socket.io/socket.io.js"></script><script src="/lang-nah.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),opts=(a,f)=>a.map(f).join(''),fmt=d=>new Date(d).toLocaleString('es-MX');
const FIN=['Resuelto','Cerrado','Entregado','Rechazado','Cancelado'],TOP=['admin','presidente'];
const ST={reporte:['Sin clasificar','Recibido','Asignado','En proceso','Resuelto','Cerrado','Rechazado'],tramite:['Recibido','En revisión','Prevención','En proceso','Pago pendiente','Pago en revisión','Pagado','Resuelto','Entregado','Rechazado','Cancelado']};
let T=localStorage.token,ME,sock,cur,CAT,LOC,CH;
const api=async(p,m='GET',b)=>{const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',...(T&&{Authorization:'Bearer '+T})},body:b&&JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j};
const late=c=>!FIN.includes(c.estatus)&&new Date(c.slaVence)<new Date();
async function boot(){CFG=await fetch('/api/config').then(r=>r.json()).catch(()=>CFG);if(CFG.color)document.documentElement.style.setProperty('--ac',CFG.color);$('#ft').innerHTML=`${esc(CFG.nombre)} · Atención: lunes a viernes de 9:00 a 16:00 · <a href=# onclick="avisoPriv();return false">Aviso de privacidad</a> · © ${new Date().getFullYear()}`;ctl();if(T){try{ME=await api('/auth/me')}catch{T=null;localStorage.removeItem('token')}}await urlActions();ME?start():login()}
function login(){let reg=false;$('#nav').innerHTML='';$('#top').textContent='Oficina Virtual Municipal';
$('#main').innerHTML=`<div class=card style="max-width:380px;margin:auto"><h3 id=t>Iniciar sesión</h3><input id=n placeholder="Nombre completo" style="display:none"><input id=e placeholder="Correo"><input id=p type=password placeholder="Contraseña"><label id=ac style="display:none"><input type=checkbox id=ap style="width:auto"> Acepto el <a href=# onclick="avisoPriv();return false">aviso de privacidad</a></label><button id=go>Entrar</button> <a href=# id=fg>¿Olvidaste tu contraseña?</a><br> <a href=# id=sw>Soy ciudadano y quiero registrarme</a></div>`;
$('#sw').onclick=e=>{e.preventDefault();reg=!reg;$('#ac').style.display=reg?'':'none';$('#fg').style.display=reg?'none':'';$('#n').style.display=reg?'':'none';$('#t').textContent=reg?'Registro de ciudadano':'Iniciar sesión';$('#go').textContent=reg?'Registrarme':'Entrar'};
$('#go').onclick=async()=>{try{const r=await api(reg?'/auth/register':'/auth/login','POST',{nombre:$('#n').value,email:$('#e').value,password:$('#p').value,acepto:$('#ap').checked});T=r.token;localStorage.token=T;ME=r.user;start()}catch(x){alert(x.message)}}}
function start(){const staff=ME.role!=='ciudadano';
const V=staff?{dash:'📊 Panel',kanban:'🗂 Tablero',casos:'📋 Casos',mapa:'🗺 Mapa',...(['admin','presidente','director'].includes(ME.role)&&{ing:'💰 Ingresos'}),tram:'📑 Trámites',chat:'💬 Mensajes',...(ME.role!=='encargado'&&{equipo:'👥 Equipo'})}:{inicio:'🏠 Inicio',nuevo:'➕ Nuevo',casos:'📋 Mis folios'};if(['admin','presidente','director'].includes(ME.role))V.avisos='📣 Comunicados';V.cit='🗓 Citas';V.tra='🔍 Transparencia';if(staff)V.inf='📄 Informe';else V.asist='🤖 Asistente';if(TOP.includes(ME.role))V.inhab='📅 Días inhábiles';if(TOP.includes(ME.role))V.cuentas='🏘 Cuentas';if(staff)V.vent='🪟 Ventanilla';else{V.priv='🔐 Mis datos';V.mcu='🏠 Mis cuentas'}V.part='🗳 Participación';if(staff){V.campo='🛠 Mis órdenes';V.activos='🔦 Activos'}V.notif='🔔 Avisos';if(ME.role=='caja'){Object.keys(V).forEach(k=>delete V[k]);V.pagos='✅ Pagos por validar';V.cuentas='🏘 Cuentas';V.ing='💰 Ingresos';V.notif='🔔 Avisos'}

const resProp=id=>modal('Responder propuesta',[{id:'estatus',label:'Estatus',type:'select',opts:['En revisión','Aprobada','Rechazada','Abierta'].map(x=>[x,x])},{id:'respuesta',label:'Respuesta pública',type:'textarea'}],v=>pa(`/propuestas/${id}/estatus`,v));
const newProy=()=>modal('Nuevo proyecto',[{id:'titulo',label:'Nombre del proyecto'},{id:'descripcion',label:'Descripción',type:'textarea'},{id:'costo',label:'Costo estimado en MXN',type:'number'}],v=>pa('/proyectos',v));
const cfgRonda=()=>modal('Configurar votación',[{id:'abierta',label:'Estado',type:'select',opts:[['1','Abierta'],['','Cerrada']]},{id:'presupuesto',label:'Presupuesto total en MXN',type:'number'},{id:'votosPorPersona',label:'Votos por persona',type:'number',value:'3'}],v=>pa('/ronda',v));
async function campo(){const l=(await api('/cases')).filter(c=>!FIN.includes(c.estatus));$('#main').innerHTML=`<div class=tip>Tus órdenes de trabajo. Usa "Llegué" al estar en el sitio y "Terminé" para cerrar con foto y ubicación.</div>`+(opts(l,c=>`<div class=card><h3>${c.folio} · ${esc(c.titulo)}</h3><p>${esc(c.department?.nombre||'')} ${late(c)?'<span class=red>vencida</span>':''}</p><button onclick="llegue('${c._id}')">📍 Llegué</button> <button onclick="termine('${c._id}')">✅ Terminé</button> <button class=sec onclick="det('${c._id}')">Ver detalle</button></div>`)||'<div class=card>No tienes órdenes pendientes.</div>')}
const gps2=()=>new Promise(r=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>r({lat:p.coords.latitude,lng:p.coords.longitude}),()=>r({})):r({}));
const evid=async(id,b)=>{try{await api(`/cases/${id}/evidencia`,'POST',{...await gps2(),...b});campo()}catch(e){alert(e.message)}};
const llegue=id=>evid(id,{nota:'Llegó al sitio'});
const termine=id=>modal('Cerrar orden en campo',[{id:'nota',label:'¿Qué se hizo?',type:'textarea'},{id:'activo',label:'Código del activo atendido (opcional)'},{id:'foto',label:'Foto del trabajo terminado',type:'file'}],async v=>{await evid(id,{nota:v.nota,activo:v.activo,cerrar:true,foto:v.foto?await comp(v.foto):undefined})});
async function activos(){const l=await api('/activos');$('#main').innerHTML=`<div class=card><h3>Inventario de activos</h3><div class=tip>Luminarias, pozos, tomas y demás infraestructura. Al cerrar una orden con el código del activo, su estado se actualiza solo.</div><button onclick="newAct()">Registrar activo</button><table><tr><th>Código<th>Tipo<th>Zona<th>Estado<th></tr>${opts(l,a=>`<tr><td>${esc(a.codigo)}<td>${esc(a.tipo||'')}<td>${esc(a.zona||'')}<td><span class="pill ${a.estado=='Operando'?'g':a.estado=='Falla'?'r':''}">${a.estado}</span><td><button onclick="estAct('${a._id}','${a.estado=='Falla'?'Operando':'Falla'}')">${a.estado=='Falla'?'Marcar operando':'Marcar con falla'}</button>`)||'<tr><td>Sin activos'}</table></div>`}
const newAct=async()=>{const ds=TOP.includes(ME.role)?await api('/departments'):[];modal('Registrar activo',[{id:'codigo',label:'Código o número de poste, pozo o toma'},{id:'tipo',label:'Tipo (luminaria, pozo, toma…)'},{id:'zona',label:'Zona o colonia'},{id:'lat',label:'Latitud (opcional)'},{id:'lng',label:'Longitud (opcional)'},...(ds.length?[{id:'department',label:'Departamento',type:'select',opts:ds.map(d=>[d._id,d.nombre])}]:[])],async v=>{await api('/activos','POST',v);activos()})};
const estAct=async(id,estado)=>{try{await api(`/activos/${id}/estado`,'POST',{estado});activos()}catch(e){alert(e.message)}};
boot();
</script></body></html>
